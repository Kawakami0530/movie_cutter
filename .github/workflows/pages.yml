name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
# Deploy from main only; rebuild both stable and dev from their latest commits.
# Both versions are always built from their respective branches on every deployment.
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable main
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: feature/share-to-mitene
          path: development
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stable/package-lock.json
      - name: Build stable site
        working-directory: stable
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build development site
        working-directory: development
        run: |
          npm ci --no-audit --no-fund
          npm run build -- --base=/movie_cutter/dev/
      - name: Assemble both sites
        run: |
          mkdir -p site/dev
          cp -a stable/dist/. site/
          cp -a development/dist/. site/dev/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
