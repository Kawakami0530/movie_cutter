<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1d4ed8" />
    <title>動画分割ツール</title>
  </head>
  <body>
    <main class="container">
      <h1>動画分割ツール</h1>
      <p class="lead">MP4を115秒ごとに分割します。動画は端末から外部へ送信しません。</p>
      <label class="picker" for="file">動画を選択（MP4）</label>
      <input id="file" type="file" accept="video/mp4,.mp4" />
      <p id="filename" class="filename" aria-live="polite">未選択</p>
      <button id="start" disabled>分割開始</button>
      <section id="progressSection" hidden aria-live="polite">
        <h2>処理状況</h2>
        <progress id="progress" max="100" value="0"></progress>
        <p id="percent">0%</p>
        <p id="count">完了 0 / 0 ファイル</p>
        <p id="status"></p>
      </section>
      <section id="errorSection" class="error" hidden role="alert">
        <h2>処理を停止しました</h2>
        <p id="errorMessage"></p>
        <p id="errorReason"></p>
        <button id="retry">やり直す</button>
      </section>
      <section id="doneSection" hidden role="status">
        <h2>処理が完了しました</h2>
        <p>各ファイルのダウンロードを開始しました。端末の「ダウンロード」を確認してください。</p>
      </section>
      <p class="note">Chromeが複数ダウンロードの許可を求めた場合は許可してください。保存完了はWebアプリから確認できません。大容量動画ではメモリ不足になる場合があります。</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
